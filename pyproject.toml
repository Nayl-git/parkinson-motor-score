[project]
name = "parkinson-motor-score"
version = "1.0.0"
description = "Predicting the unbiased OFF motor score of Parkinson's patients (Bobathon ESILV 2026)"
requires-python = ">=3.11"
dependencies = ["pandas>=2.2", "numpy>=1.26", "scikit-learn>=1.5"]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6"]

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
